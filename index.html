        <p style="font-size: 16px; color: #5E5A52;">A pure client-side financial decision simulator built for PROMPT RUN 2026. Designed for the ₹10,000 / 30-day challenge.</p>
        <hr style="border: 0; border-top: 1px solid #E6DFD2; margin: 20px 0;" />
        <h2>Core Capabilities & Features</h2>
        <ul>
          <li><strong>₹10,000 Challenge Budget:</strong> Initialize a 30-day cycle with emergency buffer cushion (default 10% / ₹1,000).</li>
          <li><strong>Dynamic Daily Allowance:</strong> Real-time discretionary pacing re-calculated dynamically after locking obligations and savings.</li>
          <li><strong>Upcoming Commitments & Incomes:</strong> Track fixed rent, EMIs, and scheduled incoming funds with calendar occurrences.</li>
          <li><strong>Digital Subscriptions:</strong> Manage recurring services with pause/resume toggles and burn rate impact.</li>
          <li><strong>Savings Goals:</strong> Priority-ranked savings goals with automated feasibility projections.</li>
          <li><strong>Decision Lab:</strong> Interactive sandbox simulator to test purchases, subscriptions, and surprise expenses before spending.</li>
          <li><strong>Transparent Scoring:</strong> Rule-based 0–100 Financial Risk Meter and multi-factor Financial Health Score with explainable drivers.</li>
          <li><strong>100% Local-First Privacy:</strong> Runs strictly in your browser using Web Crypto PBKDF2 authentication and localStorage.</li>
        </ul>
        <p><em>Please enable JavaScript in your browser to interact with the full live cockpit and Decision Lab.</em></p>
